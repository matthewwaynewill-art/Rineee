<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rinee, will you be my Valentine? 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="floating-hearts" aria-hidden="true">
    <span>💗</span><span>💕</span><span>💖</span><span>💘</span><span>💗</span><span>💞</span>
  </div>

  <main class="card">
    <div class="tiny-label">a tiny question for you ✨</div>
    <h1>Rinee, will you be<br class="mobile-break"> my Valentine? 💌</h1>
    <p class="subtitle" id="subtitle">Aku punya satu pertanyaan penting banget...</p>

    <div class="mascot" aria-label="Kucing biru lucu">
      <div class="ear ear-left"></div><div class="ear ear-right"></div>
      <div class="cat-body">
        <div class="cheek cheek-left"></div><div class="cheek cheek-right"></div>
        <div class="eye eye-left"></div><div class="eye eye-right"></div>
        <div class="mouth"><span></span></div>
        <div class="belly"></div>
      </div>
      <div class="mascot-heart">♥</div>
    </div>

    <div class="button-area">
      <button class="yes-button" id="yesButton" type="button">YES! 💗</button>
      <button class="no-button" id="noButton" type="button">No 🙃</button>
    </div>
    <p class="hint" id="hint">Pilih dengan bijak ya, Rinee 😼</p>
    <p class="footer-note">made with a little courage & lots of 💗</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
